name: SDK
permissions:
  contents: read
on:
  push: { branches: [main], paths: ['sdk/**'] }
  pull_request: { paths: ['sdk/**'] }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
        working-directory: sdk
      - run: npx tsc --noEmit
        working-directory: sdk
