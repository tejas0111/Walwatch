name: API
permissions:
  contents: read
on:
  push: { branches: [main], paths: ['api/**'] }
  pull_request: { paths: ['api/**'] }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: walwatch_test }
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
        working-directory: api
      - run: npx tsc --noEmit
        working-directory: api
      - run: npx vitest run
        working-directory: api
        env: { DATABASE_URL: postgres://postgres:postgres@localhost:5432/walwatch_test }
