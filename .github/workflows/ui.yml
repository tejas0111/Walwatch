name: UI
permissions:
  contents: read
on:
  push: { branches: [main], paths: ['ui/**'] }
  pull_request: { paths: ['ui/**'] }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
        working-directory: ui
      - run: npx next build
        working-directory: ui
