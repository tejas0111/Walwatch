version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - walwatch

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: walwatch
      POSTGRES_USER: walwatch
      POSTGRES_PASSWORD: walwatch_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walwatch"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - walwatch

  api:
    build: ./api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://walwatch:walwatch_dev@postgres:5432/walwatch
      JWT_SECRET: dev-jwt-secret-do-not-use-in-prod
      NODE_ENV: development
      SUI_RPC_URL: https://fullnode.testnet.sui.io:443
      PACKAGE_ID: ${PACKAGE_ID:-}
      SYSTEM_OBJECT_ID: ${SYSTEM_OBJECT_ID:-}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      REQUEST_SIZE_LIMIT: 1mb
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - walwatch

  keeper:
    build:
      context: .
      dockerfile: keeper/Dockerfile
    environment:
      DATABASE_URL: postgres://walwatch:walwatch_dev@postgres:5432/walwatch
      KEEPER_PRIVATE_KEY: ${KEEPER_PRIVATE_KEY:-}
      SUI_RPC_URL: https://fullnode.testnet.sui.io:443
      PACKAGE_ID: ${PACKAGE_ID:-}
      SYSTEM_OBJECT_ID: ${SYSTEM_OBJECT_ID:-}
      NODE_ENV: development
      ENABLE_LEADER_ELECTION: ${ENABLE_LEADER_ELECTION:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - walwatch
    profiles:
      - keeper

  ui:
    build: ./ui
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SUI_RPC_URL: https://fullnode.testnet.sui.io:443
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - walwatch

networks:
  walwatch:
    driver: bridge

volumes:
  pgdata:
